<script type="text/javascript">
  RED.nodes.registerType('turbo-notify-status', {
    category: 'Turbo Notify',
    color: '#8fd0a8',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'turbo-notify-config', required: true },
      number: { value: 'main' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-check-square-o',
    paletteLabel: 'whatsapp status',
    label: function () {
      return this.name || 'whatsapp status';

</script>

<script type="text/html" data-template-name="turbo-notify-status">
  <div class="form-tips" style="margin-bottom: 14px">
    Checks WhatsApp messages you sent through your Turbo Notify account. Need an account node first? Click the <b>+</b> next to <b>Account</b> and follow the three steps there:
    a Turbo Notify account, your WhatsApp number linked, and an API key.
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-user"></i> Account</label>
    <input type="text" id="node-input-server" />
  </div>
  <div class="form-row">
    <label for="node-input-number"><i class="fa fa-mobile"></i> Number</label>
    <input type="text" id="node-input-number" placeholder="main" />
  </div>
  <div class="form-tips" style="margin-top: -4px">
    <code>main</code> is the WhatsApp number you linked first. Change it only if you linked extra numbers.
  </div>
</script>

<script type="text/html" data-help-name="turbo-notify-status">
  <p>Reads how far a WhatsApp message has got: pending, sent, delivered, read or failed.</p>

  <p>
    You need a Turbo Notify account with your WhatsApp number linked and an API key. The <b>Turbo Notify account</b>
    node shows how to get them in three steps.
  </p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>messageId <span class="property-type">string</span></dt>
    <dd>
      The id of the message (<code>msg_...</code>). The whatsapp send node sets it, so you can wire the two
      nodes one after the other. When it is missing, a text <code>msg.payload</code> holding a message id, or
      an object with <code>message_id</code>, is used.
    </dd>
    <dt class="optional">number <span class="property-type">string</span></dt>
    <dd>
      The number the message was sent from: <code>main</code>, an alias or a <code>num_...</code> id. Ids
      belong to one number, so this must be the sending number. Overrides the Number property.
    </dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>
      The status of the message. <code>status.state</code> is <code>pending</code>, <code>sent</code>,
      <code>delivered</code>, <code>read</code> or <code>failed</code>, and <code>status.at</code> is when it got
      there. For a failed message <code>status.error</code> holds the reason (<code>code</code>,
      <code>message</code> and, when there is one, <code>hint</code>).
    </dd>
  </dl>

  <h3>Details</h3>
  <p>
    A send is accepted at once and delivered later. Read the status after a short delay (a delay node of a few
    seconds) if the flow needs to know the message arrived. Errors are reported the same way as in the
    whatsapp send node.
  </p>

  <h3>References</h3>
  <ul>
    <li><a href="https://docs.turbonotify.com/en/messages/status/">Message status</a></li>
  </ul>
</script>
