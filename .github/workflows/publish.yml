# Publishes this package to npm when a version tag is pushed, with an npm
# provenance statement: anyone can verify that the package was built by this
# workflow, from this repository and commit. Do not publish from a local machine.
#
# First release of a new package: add a granular npm token as the Actions secret NPM_TOKEN, push the tag,
# then do the Trusted Publisher setup below and delete both the secret and the token.
#
# One-time setup (Trusted Publisher, no long-lived secret):
#   1. On npmjs.com open the package settings, section Trusted Publisher.
#   2. Choose GitHub Actions and enter the repository owner, the repository
#      name and the workflow file name publish.yml. Leave Environment empty.
#
# Releasing: update the version in package.json and src/lib/version.ts, update
# CHANGELOG.md, commit, then push a tag that equals the version (for example 1.5.15).
#
# The first package name, @turbo-notify/node-red-turbo-notify, is kept as a signpost: the folder redirect/ has no
# nodes and depends on the new package, so an install or an update of the old name brings the new one. It is
# published by this same workflow (the Trusted Publisher of the old name is bound to this file) when a tag named
# redirect-<version> is pushed, where <version> is the version in redirect/package.json.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    if: ${{ !startsWith(github.ref_name, 'redirect-') }}
    runs-on: ubuntu-latest

    permissions:
      # Needed to mint the OIDC token used for the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted Publisher needs npm 11.5.1 or later, which ships with Node 24.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: The tag must equal the package version
        run: |
          [ "${GITHUB_REF_NAME}" = "$(node -p "require('./package.json').version")" ]

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        # With a Trusted Publisher the token step is skipped and npm uses the OIDC exchange. The very first
        # release of a new package needs the NPM_TOKEN secret (a Trusted Publisher can only be set on a
        # package that exists); delete the secret and the token right after.
        run: |
          if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  redirect:
    name: Publish the redirect of the first package name
    if: ${{ startsWith(github.ref_name, 'redirect-') }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: The tag must name the redirect version
        run: |
          [ "${GITHUB_REF_NAME}" = "redirect-$(node -p "require('./redirect/package.json').version")" ]

      - name: Publish
        working-directory: redirect
        run: npm publish --provenance --access public
